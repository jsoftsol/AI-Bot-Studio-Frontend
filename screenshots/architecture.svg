<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">AI Bot Studio: where the builder app fits</text>

  <rect x="30" y="80" width="190" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="125" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Business or agency</text>
  <text x="125" y="132" text-anchor="middle" font-size="12" fill="#4c1d95">builds and manages bots</text>

  <rect x="290" y="80" width="260" height="220" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="420" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">Builder app (Vue 3 SPA)</text>
  <rect x="310" y="120" width="220" height="30" rx="6" fill="#ffffff" stroke="#4f46e5"/>
  <text x="420" y="140" text-anchor="middle" font-size="12" fill="#1e1b4b">Bot library and bot builder</text>
  <rect x="310" y="158" width="220" height="30" rx="6" fill="#ffffff" stroke="#4f46e5"/>
  <text x="420" y="178" text-anchor="middle" font-size="12" fill="#1e1b4b">Training center and channels</text>
  <rect x="310" y="196" width="220" height="30" rx="6" fill="#ffffff" stroke="#4f46e5"/>
  <text x="420" y="216" text-anchor="middle" font-size="12" fill="#1e1b4b">Leads, tags, domains, assistants</text>
  <rect x="310" y="234" width="220" height="30" rx="6" fill="#ffffff" stroke="#4f46e5"/>
  <text x="420" y="254" text-anchor="middle" font-size="12" fill="#1e1b4b">Agency clients, API keys</text>
  <text x="420" y="286" text-anchor="middle" font-size="11" fill="#312e81">32 stores, 30 services</text>

  <rect x="620" y="80" width="350" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="795" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">Backend API (NestJS)</text>
  <text x="795" y="132" text-anchor="middle" font-size="12" fill="#064e3b">REST for bots, knowledge, leads, channels</text>
  <text x="795" y="150" text-anchor="middle" font-size="12" fill="#064e3b">Socket.IO for training progress and previews</text>
  <text x="795" y="168" text-anchor="middle" font-size="12" fill="#064e3b">OpenAI, vector search, queues behind it</text>

  <rect x="620" y="220" width="350" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="795" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Platform sign-in dialogs</text>
  <text x="795" y="270" text-anchor="middle" font-size="12" fill="#713f12">Meta, Instagram, Google return a code</text>
  <text x="795" y="286" text-anchor="middle" font-size="12" fill="#713f12">that the app passes to the backend</text>

  <rect x="290" y="370" width="260" height="90" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="420" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">Public chat app</text>
  <text x="420" y="420" text-anchor="middle" font-size="12" fill="#831843">what visitors use: chat page,</text>
  <text x="420" y="438" text-anchor="middle" font-size="12" fill="#831843">popup widget, embed script</text>

  <rect x="620" y="370" width="350" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="795" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Onboarding service</text>
  <text x="795" y="420" text-anchor="middle" font-size="12" fill="#334155">tutorial videos and the sign-up wizard</text>
  <text x="795" y="438" text-anchor="middle" font-size="12" fill="#334155">served by an outside provider</text>

  <line x1="220" y1="120" x2="286" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="550" y1="135" x2="616" y2="135" stroke="#475569" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="550" y1="250" x2="616" y2="260" stroke="#475569" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="420" y1="300" x2="420" y2="366" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="432" y="336" font-size="11" fill="#475569">embed code and link</text>
  <line x1="550" y1="290" x2="616" y2="395" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
